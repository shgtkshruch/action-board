name: Build & Test E2E/RLS
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build & Tests
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # 環境変数を設定（ローカルSupabaseの接続情報）
      - name: Set Supabase environment variables
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=sb_secret_N7UND0UgjKTVK-Uodkm0Hg_xSvEMPvz" >> $GITHUB_ENV
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:54322/postgres" >> $GITHUB_ENV
          echo "ENABLE_CONFIRMATIONS=false" >> $GITHUB_ENV

      # Supabase CLIのセットアップと起動
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Supabaseをバックグラウンドで起動（依存関係インストールと並列）
      - name: Start Supabase (background)
        run: supabase start -x studio,postgres-meta,imgproxy &
        env:
          SMTP_ENABLED: false
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
          BQ_USER_PASSWORD: bq_user_password

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Playwrightブラウザのキャッシュ
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm list @playwright/test --json | jq -r '.[0].devDependencies["@playwright/test"].version')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright dependencies (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Next.jsビルドキャッシュ
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm run build

      # Supabaseの起動を待機
      - name: Wait for Supabase
        run: |
          echo "Waiting for Supabase to be ready..."
          timeout 30 bash -c 'until curl -s http://localhost:54321/rest/v1/ > /dev/null; do sleep 1; done'
          echo "Supabase is ready!"

      # Supabaseのデータベースをリセット
      - name: Reset Supabase database
        run: supabase db reset
        env:
          SMTP_ENABLED: false
          BQ_USER_PASSWORD: bq_user_password

      # ポスターデータをロード
      - name: Load poster CSV data
        run: pnpm run poster:load-csv

      - name: Run CI Tests
        run: pnpm run test:ci:e2e
        env:
          CI: 'true'

      - name: Upload Jest test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-report
          path: jest-report/
          retention-days: 30

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
